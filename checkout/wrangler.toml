name = "marufi-checkout"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
SITE_URL = "https://your-domain.com"
SUCCESS_URL = "https://your-domain.com/thank-you.html?session_id={CHECKOUT_SESSION_ID}"
CANCEL_URL = "https://your-domain.com/#guides"
ALLOWED_ORIGINS = "https://your-domain.com,https://www.your-domain.com"
DOWNLOAD_HOURS = "72"
FROM_EMAIL = "Marufi Digital <orders@your-domain.com>"
CONTACT_EMAIL = "hello@your-domain.com"
# ALLOWED_PRICES = "price_123,price_456"

# Secrets, set with `wrangler secret put NAME`:
#   STRIPE_SECRET_KEY   your Stripe secret key
#   ADMIN_PASSWORD      the dashboard password (choose a long one)
#   DOWNLOAD_SECRET     any long random string (signs download links and admin sessions)
#   RESEND_API_KEY      optional, for e-mail through resend.com
#   ADMIN_TOKEN         optional, bearer token for scripts

# Uploaded covers (public) and purchased files (private) live in this R2 bucket.
# Create it with: wrangler r2 bucket create marufi-files
[[r2_buckets]]
binding = "FILES"
bucket_name = "marufi-files"

# The live catalog, backups, reader requests, and login throttling live in this KV namespace.
# Create it with: wrangler kv namespace create STORE   (then paste the id below)
[[kv_namespaces]]
binding = "STORE"
id = "paste-the-kv-namespace-id-here"
