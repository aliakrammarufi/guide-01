name = "marufi-checkout"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
SITE_URL = "https://aliakrammarufi.github.io/guide-01"
SUCCESS_URL = "https://aliakrammarufi.github.io/guide-01/thank-you.html?session_id={CHECKOUT_SESSION_ID}"
CANCEL_URL = "https://aliakrammarufi.github.io/guide-01/#guides"
ALLOWED_ORIGINS = "https://aliakrammarufi.github.io,http://localhost:8765"
DOWNLOAD_HOURS = "72"
FROM_EMAIL = "Marufi Digital <orders@your-domain.com>"
CONTACT_EMAIL = "hello@your-domain.com"
# ALLOWED_PRICES = "price_123,price_456"

# Secrets, set with `wrangler secret put NAME`:
#   STRIPE_SECRET_KEY   your Stripe secret key
#   ADMIN_PASSWORD      the dashboard password (choose a long one)
#   DOWNLOAD_SECRET     any long random string (signs download links and admin sessions)
#   RESEND_API_KEY      optional, for e-mail through resend.com
#   ADMIN_TOKEN         optional, bearer token for scripts

# Uploaded covers (public) and purchased files (private). Without R2 they live in the STORE KV namespace below
# (25 MB per file, 1 GB total on the free plan, no card needed). To move to R2 later: enable R2 in the dashboard,
# run `wrangler r2 bucket create marufi-files`, uncomment these three lines, and redeploy.
# [[r2_buckets]]
# binding = "FILES"
# bucket_name = "marufi-files"

# The live catalog, backups, reader requests, and login throttling live in this KV namespace.
# Create it with: wrangler kv namespace create STORE   (then paste the id below)
[[kv_namespaces]]
binding = "STORE"
id = "4ea3f8d4be8f4043a7150f50e69e10a5"
